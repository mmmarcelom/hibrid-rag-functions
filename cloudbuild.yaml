steps:
  # Build message-receiver
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/message-receiver:$COMMIT_SHA', '-f', 'message_receiver_Dockerfile', '.']
    
  # Build message-buffer  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/message-buffer:$COMMIT_SHA', '-f', 'message_buffer_Dockerfile', '.']
    
  # Build message-delivery
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/message-delivery:$COMMIT_SHA', '-f', 'message_delivery_Dockerfile', '.']
    
  # Deploy message-receiver to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'message-receiver'
      - '--image'
      - 'gcr.io/$PROJECT_ID/message-receiver:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SUPABASE_URL=${_SUPABASE_URL},SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY},GOOGLE_PROJECT_ID=$PROJECT_ID,CLOUD_TASKS_QUEUE_ID=${_CLOUD_TASKS_QUEUE_ID},CLOUD_TASKS_LOCATION=${_CLOUD_TASKS_LOCATION},MESSAGE_BUFFER_URL=${_MESSAGE_BUFFER_URL}'
      
  # Deploy message-buffer to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'message-buffer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/message-buffer:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SUPABASE_URL=${_SUPABASE_URL},SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY},GOOGLE_PROJECT_ID=$PROJECT_ID,PUBSUB_TOPIC_TO_PROCESS=${_PUBSUB_TOPIC_TO_PROCESS}'
      
  # Deploy message-delivery to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'message-delivery'
      - '--image'
      - 'gcr.io/$PROJECT_ID/message-delivery:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SUPABASE_URL=${_SUPABASE_URL},SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY},GOOGLE_PROJECT_ID=$PROJECT_ID'

# Substituições (serão configuradas no Cloud Build)
substitutions:
  _SUPABASE_URL: 'https://your-project.supabase.co'
  _SUPABASE_ANON_KEY: 'your-anon-key'
  _CLOUD_TASKS_QUEUE_ID: 'message-processing-queue'
  _CLOUD_TASKS_LOCATION: 'southamerica-east1'
  _MESSAGE_BUFFER_URL: 'https://message-buffer-xxxxx-sae1.a.run.app'
  _PUBSUB_TOPIC_TO_PROCESS: 'para-processamento'

# Imagens que serão criadas
images:
  - 'gcr.io/$PROJECT_ID/message-receiver:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/message-buffer:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/message-delivery:$COMMIT_SHA'
